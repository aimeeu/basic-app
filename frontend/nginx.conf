server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Serve the React SPA: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; env-config.js must not be cached
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Proxy /api and /health requests to the backend API.
    # BACKEND_API_URL is substituted by envsubst in docker-entrypoint.sh.
    # Uncomment and set the upstream block below if you want Nginx to proxy
    # API requests instead of having the browser call the backend directly.
    #
    # location /api/ {
    #     proxy_pass ${BACKEND_API_URL}/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}
